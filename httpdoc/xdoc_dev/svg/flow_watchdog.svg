<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f3460"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e94560"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8695"/></marker>
</defs>
<style>
text{fill:#1a1a2e;font-size:12px}
.m{font-family:monospace;font-size:11.5px;fill:#0f3460}
.b{font-weight:bold;font-size:12.5px}
.s{font-size:10px;fill:#5a6472}
.sm{font-family:monospace;font-size:10px;fill:#5a6472}
.box{fill:#f7f8fa;stroke:#0f3460;stroke-width:1.5}
.acc{fill:#fdeef1;stroke:#e94560;stroke-width:1.5}
.gry{fill:#f2f3f5;stroke:#7a8695;stroke-width:1.5}
.grn{fill:#eef8f1;stroke:#27ae60;stroke-width:1.5}
.yel{fill:#fdf6e3;stroke:#c8a24a;stroke-width:1.5}
.zone{fill:#eef4ff;stroke:#5a7fbf;stroke-width:1.5;stroke-dasharray:7 4}
.zoner{fill:#fff5f7;stroke:#e94560;stroke-width:1.5;stroke-dasharray:7 4}
.zoneg{fill:#f6f7f8;stroke:#7a8695;stroke-width:1.5;stroke-dasharray:7 4}
.life{stroke:#9aa3ad;stroke-width:1.2;stroke-dasharray:4 4}
.arr{stroke:#0f3460;stroke-width:1.8;fill:none;marker-end:url(#a)}
.arr2{stroke:#0f3460;stroke-width:1.8;fill:none;marker-end:url(#a);marker-start:url(#a)}
.ard{stroke:#e94560;stroke-width:2.4;fill:none;marker-end:url(#ar)}
.ard2{stroke:#e94560;stroke-width:2.4;fill:none;marker-end:url(#ar);marker-start:url(#ar)}
.arg{stroke:#27ae60;stroke-width:1.8;fill:none;marker-end:url(#ag)}
.ary{stroke:#7a8695;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#ay)}
.lin{stroke:#0f3460;stroke-width:1.5;fill:none}
.act{fill:#dfe8f7;stroke:#0f3460;stroke-width:1}
</style>
<rect width="900" height="200" fill="#ffffff"/>

<path class="lin" d="M40,110 L870,110"/>
<rect class="grn" x="40" y="118" width="100" height="18" rx="3"/>
<text x="90" y="131" text-anchor="middle" class="sm">grace 5 s</text>
<path class="arg" d="M120,55 L120,106"/>
<path class="arg" d="M200,55 L200,106"/>
<path class="arg" d="M280,55 L280,106"/>
<path class="arg" d="M360,55 L360,106"/>
<path class="arg" d="M440,55 L440,106"/>
<text x="280" y="45" text-anchor="middle" class="s">pid_req from the main server, about one per second</text>
<rect class="yel" x="440" y="118" width="300" height="18" rx="3"/>
<text x="590" y="131" text-anchor="middle" class="sm">silence: 20 s, monotonic clock</text>
<path class="ard" d="M740,110 L740,150"/>
<rect class="acc" x="610" y="152" width="270" height="40" rx="6"/>
<text x="745" y="169" text-anchor="middle" class="m">ctrl_link_stop</text>
<text x="745" y="183" text-anchor="middle" class="s">unlink paths, kill tap children, exit 0</text>
<text x="40" y="175" text-anchor="start" class="s">stall_detect.h credits back the time the satellite was not run</text>
</svg>
