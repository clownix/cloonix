<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f3460"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e94560"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8695"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker>
</defs>
<style>
text{fill:#1a1a2e;font-size:12px}
.m{font-family:monospace;font-size:11.5px;fill:#0f3460}
.w{fill:#ffffff;font-size:11px;font-weight:bold}
.s{font-size:10px;fill:#5a6472}
.box{fill:#f7f8fa;stroke:#0f3460;stroke-width:1.5}
.acc{fill:#fdeef1;stroke:#e94560;stroke-width:1.5}
.gry{fill:#f2f3f5;stroke:#7a8695;stroke-width:1.5}
.grn{fill:#eef8f1;stroke:#27ae60;stroke-width:1.5}
.yel{fill:#fdf6e3;stroke:#c8a24a;stroke-width:1.5}
.zone{fill:#eef4ff;stroke:#5a7fbf;stroke-width:1.5;stroke-dasharray:7 4}
.zoner{fill:#fff5f7;stroke:#e94560;stroke-width:1.5;stroke-dasharray:7 4}
.zoneg{fill:#f6f7f8;stroke:#7a8695;stroke-width:1.5;stroke-dasharray:7 4}
.cab{stroke:#3498db;stroke-width:2.5;fill:none}
.fib{stroke:#c8a24a;stroke-width:2.5;fill:none}
.arr{stroke:#0f3460;stroke-width:2;fill:none;marker-end:url(#a)}
.arrr{stroke:#e94560;stroke-width:2;fill:none;marker-end:url(#ar)}
.arg{stroke:#7a8695;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#ag)}
.lin{stroke:#0f3460;stroke-width:1.5;fill:none}
.ink{fill:#0f3460}
.pink{fill:#e94560}
.t{font-size:13px;font-weight:bold;fill:#0f3460}
.big{font-size:15px;font-weight:bold;fill:#0f3460}
.cabd{stroke:#3498db;stroke-width:2.5;fill:none;stroke-dasharray:6 4}
.air{fill:#fff8ec;stroke:#e08a1e;stroke-width:1.5;stroke-dasharray:3 3}
.arro{stroke:#e08a1e;stroke-width:2;fill:none;marker-end:url(#ao)}
.org{fill:#e08a1e}
</style>
<rect width="900" height="330" fill="#ffffff"/>
<text x="20" y="28" text-anchor="start" class="t">one line of cloonix, word by word</text>
<rect class="box" x="20" y="50" width="107" height="40" rx="6"/>
<text x="73.5" y="74" text-anchor="middle" class="m">cloonix</text>
<line class="arg" x1="73.5" y1="90" x2="73.5" y2="110"/>
<text x="73.5" y="128" text-anchor="middle" class="s">the command</text>
<rect class="box" x="139" y="50" width="80" height="40" rx="6"/>
<text x="179" y="74" text-anchor="middle" class="m">cli</text>
<line class="arg" x1="179" y1="90" x2="179" y2="110"/>
<text x="179" y="128" text-anchor="middle" class="s">speak to one net</text>
<rect class="yel" x="231" y="50" width="80" height="40" rx="6"/>
<text x="271" y="74" text-anchor="middle" class="m">nemo</text>
<line class="arg" x1="271" y1="90" x2="271" y2="110"/>
<text x="271" y="128" text-anchor="middle" class="s">the net</text>
<rect class="acc" x="323" y="50" width="80" height="40" rx="6"/>
<text x="363" y="74" text-anchor="middle" class="m">cnf</text>
<line class="arg" x1="363" y1="90" x2="363" y2="110"/>
<text x="363" y="128" text-anchor="middle" class="s">the verb</text>
<rect class="grn" x="415" y="50" width="80" height="40" rx="6"/>
<text x="455" y="74" text-anchor="middle" class="m">cnt1</text>
<line class="arg" x1="455" y1="90" x2="455" y2="110"/>
<text x="455" y="128" text-anchor="middle" class="s">the object</text>
<rect class="gry" x="507" y="50" width="80" height="40" rx="6"/>
<text x="547" y="74" text-anchor="middle" class="m">eth0</text>
<line class="arg" x1="547" y1="90" x2="547" y2="110"/>
<text x="547" y="128" text-anchor="middle" class="s">its interface,</text>
<text x="547" y="142" text-anchor="middle" class="s">when it has several</text>
<rect class="acc" x="599" y="50" width="118" height="40" rx="6"/>
<text x="658" y="74" text-anchor="middle" class="m">sniff=on</text>
<line class="arg" x1="658" y1="90" x2="658" y2="110"/>
<text x="658" y="128" text-anchor="middle" class="s">a setting,</text>
<text x="658" y="142" text-anchor="middle" class="s">always key=value</text>
<text x="20" y="185" text-anchor="start" class="t">the four top-level verbs</text>
<rect class="box" x="20" y="200" width="200" height="34" rx="6"/>
<text x="120" y="221" text-anchor="middle" class="m">cloonix list</text>
<text x="120" y="252" text-anchor="middle" class="s">every net: up, version, time</text>
<rect class="box" x="234" y="200" width="200" height="34" rx="6"/>
<text x="334" y="221" text-anchor="middle" class="m">cloonix start nemo</text>
<text x="334" y="252" text-anchor="middle" class="s">start the server of nemo</text>
<rect class="box" x="448" y="200" width="200" height="34" rx="6"/>
<text x="548" y="221" text-anchor="middle" class="m">cloonix stop nemo</text>
<text x="548" y="252" text-anchor="middle" class="s">destroy all of nemo, stop it</text>
<rect class="box" x="662" y="200" width="200" height="34" rx="6"/>
<text x="762" y="221" text-anchor="middle" class="m">cloonix cli nemo ...</text>
<text x="762" y="252" text-anchor="middle" class="s">any verb below, on nemo</text>
<text x="20" y="292" text-anchor="start" class="m">a value is key=value:  ram=2000  publish=8080:80  startup_env=A=1</text>
<text x="20" y="314" text-anchor="start" class="m">a yes is a --flag:  --persistent  --macvlan  --no_reboot</text>
</svg>
