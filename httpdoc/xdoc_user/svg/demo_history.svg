<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f3460"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e94560"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8695"/></marker>
</defs>
<style>
text{fill:#1a1a2e;font-size:12px}
.m{font-family:monospace;font-size:11.5px;fill:#0f3460}
.w{fill:#ffffff;font-size:11px;font-weight:bold}
.s{font-size:10px;fill:#5a6472}
.box{fill:#f7f8fa;stroke:#0f3460;stroke-width:1.5}
.acc{fill:#fdeef1;stroke:#e94560;stroke-width:1.5}
.gry{fill:#f2f3f5;stroke:#7a8695;stroke-width:1.5}
.grn{fill:#eef8f1;stroke:#27ae60;stroke-width:1.5}
.yel{fill:#fdf6e3;stroke:#c8a24a;stroke-width:1.5}
.zone{fill:#eef4ff;stroke:#5a7fbf;stroke-width:1.5;stroke-dasharray:7 4}
.zoner{fill:#fff5f7;stroke:#e94560;stroke-width:1.5;stroke-dasharray:7 4}
.zoneg{fill:#f6f7f8;stroke:#7a8695;stroke-width:1.5;stroke-dasharray:7 4}
.cab{stroke:#3498db;stroke-width:2.5;fill:none}
.arr{stroke:#0f3460;stroke-width:2;fill:none;marker-end:url(#a)}
.arr2{stroke:#0f3460;stroke-width:2;fill:none;marker-end:url(#a);marker-start:url(#a)}
.arrr{stroke:#e94560;stroke-width:2;fill:none;marker-end:url(#ar)}
.arg{stroke:#7a8695;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#ag)}
.lin{stroke:#0f3460;stroke-width:1.5;fill:none}
.cross{stroke:#e94560;stroke-width:3}
</style>
<rect width="900" height="400" fill="#ffffff"/>
<rect x="20" y="150" width="150" height="92" rx="6" class="yel"/>
<text x="95" y="172" text-anchor="middle" font-weight="bold">the demo</text>
<text x="95" y="190" text-anchor="middle" class="s">run on the host</text>
<text x="95" y="212" text-anchor="middle" class="m">show()   story()</text>
<text x="95" y="230" text-anchor="middle" class="s">CLOONIX_DEMO_STORY=1</text>
<path d="M170,172 C200,172 200,95 232,95" class="arr"/>
<text x="95" y="100" text-anchor="middle" class="s">"    $ cloonix ..."</text><text x="95" y="113" text-anchor="middle" class="s">unmarked: to the log</text>
<path d="M170,220 C205,220 200,300 232,300" class="arrr"/>
<text x="95" y="290" text-anchor="middle" class="s">"#story# ..."</text><text x="95" y="303" text-anchor="middle" class="s">marked: to the popup</text>
<rect x="235" y="20" width="300" height="150" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<rect x="235" y="20" width="300" height="20" rx="6" fill="#161b22"/>
<circle cx="247" cy="30" r="4" fill="#3fb950"/><text x="258" y="34" style="fill:#8b949e;font-size:10px">Demo — script player</text>
<rect x="243" y="46" width="38" height="16" rx="3" fill="#0f3460"/><text x="262" y="58" text-anchor="middle" style="fill:#e6edf3;font-size:10px">Play</text>
<rect x="283" y="46" width="60" height="16" rx="3" fill="#0f3460"/><text x="313" y="58" text-anchor="middle" style="fill:#e6edf3;font-size:10px">Commands</text>
<rect x="345" y="46" width="86" height="16" rx="3" fill="#0f3460"/><text x="388" y="58" text-anchor="middle" style="fill:#e6edf3;font-size:10px">Clear Screen</text>
<rect x="433" y="46" width="56" height="16" rx="3" fill="#0f3460"/><text x="461" y="58" text-anchor="middle" style="fill:#e6edf3;font-size:10px">History</text>
<text x="245" y="82" style="font-family:monospace;font-size:10px;fill:#e6edf3">$ cloonix cli nemo add cnt gwA eth=2 wg_trixie</text>
<text x="245" y="97" style="font-family:monospace;font-size:10px;fill:#e6edf3">$ cloonix cli nemo plug gwA eth1 lanC</text>
<text x="245" y="112" style="font-family:monospace;font-size:10px;fill:#e6edf3">$ cloonix cli nemo ssh gwA &quot;wg-quick up wg0&quot;</text>
<text x="245" y="127" style="font-family:monospace;font-size:10px;fill:#e6edf3">$ cloonix cli nemo cnf gwA eth1 sniff=on</text>
<text x="245" y="142" style="font-family:monospace;font-size:10px;fill:#e6edf3">$ cloonix cli nemo sniff gwA eth1 --dump</text>
<text x="245" y="157" style="font-family:monospace;font-size:10px;fill:#ffffff">[DONE ok=1 ko=0]</text>
<text x="385" y="188" text-anchor="middle" class="s">the log: the cloonix commands, one after the other,</text>
<text x="385" y="201" text-anchor="middle" class="s">what a terminal run prints too; keys typed here reach the demo</text>
<rect x="235" y="215" width="420" height="175" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<rect x="235" y="215" width="420" height="20" rx="6" fill="#161b22"/>
<circle cx="247" cy="225" r="4" fill="#3fb950"/><text x="258" y="229" style="fill:#8b949e;font-size:10px">History — wg.py</text>
<text x="247" y="250" style="fill:#e6edf3;font-size:10.5px">Steps</text><rect x="245" y="254" width="30" height="2" fill="#f78166"/>
<text x="290" y="250" style="fill:#8b949e;font-size:10.5px">About</text>
<text x="645" y="250" text-anchor="end" style="fill:#e3b341;font-size:10px">running · step 9 · 01:12</text>
<rect x="245" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="255" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">i</text>
<rect x="269" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="279" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">1</text>
<rect x="293" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="303" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">2</text>
<rect x="317" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="327" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">3</text>
<rect x="341" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="351" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">4</text>
<rect x="365" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="375" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">5</text>
<rect x="389" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="399" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">6</text>
<rect x="413" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="423" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">7</text>
<rect x="437" y="262" width="20" height="13" rx="6.5" fill="none" stroke="#3fb950"/><text x="447" y="272" text-anchor="middle" style="fill:#3fb950;font-size:9px;font-weight:bold">8</text>
<rect x="461" y="262" width="20" height="13" rx="6.5" fill="#e3b341" stroke="#e3b341"/><text x="471" y="272" text-anchor="middle" style="fill:#0d1117;font-size:9px;font-weight:bold">9</text>
<rect x="245" y="284" width="16" height="12" rx="6" fill="#e3b341"/><text x="253" y="293" text-anchor="middle" style="fill:#0d1117;font-size:9px;font-weight:bold">9</text>
<text x="267" y="294" style="fill:#d2a8ff;font-size:10.5px;font-weight:bold">ACT 2</text><text x="305" y="294" style="fill:#e6edf3;font-size:10.5px;font-weight:bold">the tunnel comes up, and the handshake is caught</text>
<text x="645" y="294" text-anchor="end" style="fill:#6e7681;font-size:9px">01:04</text>
<text x="247" y="312" style="font-family:monospace;font-size:9.5px;fill:#c9d1d9">Two messages, and neither of them says anything. There is no</text>
<text x="247" y="326" style="font-family:monospace;font-size:9.5px;fill:#c9d1d9">version, no list of ciphers, no certificate, no name.</text>
<text x="247" y="340" style="font-family:monospace;font-size:9.5px;fill:#79c0ff">    cloonix cli nemo sniff gwA eth1 --dump udp port 51820</text>
<text x="247" y="354" style="font-family:monospace;font-size:9.5px;fill:#8b949e">▸ 7 cloonix commands run for this, as typed in a shell</text>
<rect x="245" y="364" width="400" height="18" rx="3" fill="none" stroke="#238636"/><text x="252" y="376" style="fill:#3fb950;font-size:9.5px">The demo went to its end. The network is left running …</text>
<text x="672" y="34" font-weight="bold" style="font-size:11px">Steps</text>
<text x="672" y="47" class="s">one section per step of the demo,</text>
<text x="672" y="59" class="s">written as it runs</text>
<text x="672" y="80" font-weight="bold" style="font-size:11px">chips</text>
<text x="672" y="93" class="s">one per step: amber running, green</text>
<text x="672" y="105" class="s">done, red failed; a click goes to it</text>
<text x="672" y="126" font-weight="bold" style="font-size:11px">blue lines</text>
<text x="672" y="139" class="s">commands the demo suggests: a click</text>
<text x="672" y="151" class="s">one</text>
<text x="672" y="172" font-weight="bold" style="font-size:11px">▸ fold</text>
<text x="672" y="185" class="s">the commands the step ran, the same</text>
<text x="672" y="197" class="s">lines as the log</text>
<text x="672" y="218" font-weight="bold" style="font-size:11px">amber, red</text>
<text x="672" y="231" class="s">what the demo asked for, or said on</text>
<text x="672" y="243" class="s">stderr</text>
<text x="672" y="264" font-weight="bold" style="font-size:11px">About</text>
<text x="672" y="277" class="s">the docstring: the network, the acts,</text>
<text x="672" y="289" class="s">the packet to catch</text>
<text x="672" y="310" font-weight="bold" style="font-size:11px">History button</text>
<text x="672" y="323" class="s">opens the popup again, nothing lost</text>
</svg>
