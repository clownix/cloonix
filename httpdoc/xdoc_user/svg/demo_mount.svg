<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<style>
text{fill:#1a1a2e;font-size:12px}
.m{font-family:monospace;font-size:11.5px;fill:#0f3460}
.w{fill:#ffffff;font-size:11px;font-weight:bold}
.s{font-size:10px;fill:#5a6472}
.yel{fill:#fdf6e3;stroke:#c8a24a;stroke-width:1.5}
.cab{stroke:#3498db;stroke-width:2.5;fill:none}
.arg{stroke:#7a8695;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
</style>
<rect width="900" height="210" fill="#ffffff"/>
<circle cx="450" cy="60" r="18" fill="#555555" stroke="#888888" stroke-width="2"/>
<text x="450" y="37" text-anchor="middle" class="m">lan1</text>
<circle cx="250" cy="120" r="18" fill="#6666cc" stroke="#9999ff" stroke-width="2"/>
<text x="250" y="124" text-anchor="middle" class="w">cnt1</text>
<circle cx="250" cy="102" r="7" fill="#27ae60" stroke="#54ff54" stroke-width="1.5"/>
<text x="250" y="105.5" text-anchor="middle" class="w" font-size="9">0</text>
<path class="cab" d="M250,102 L450,60"/>
<circle cx="650" cy="120" r="18" fill="#6666cc" stroke="#9999ff" stroke-width="2"/>
<text x="650" y="124" text-anchor="middle" class="w">cnt2</text>
<circle cx="650" cy="102" r="7" fill="#27ae60" stroke="#54ff54" stroke-width="1.5"/>
<text x="650" y="105.5" text-anchor="middle" class="w" font-size="9">0</text>
<path class="cab" d="M650,102 L450,60"/>
<text x="250" y="150" text-anchor="middle" class="s">NODE_ID=cnt1 ROLE=writer</text>
<text x="650" y="150" text-anchor="middle" class="s">NODE_ID=cnt2 ROLE=reader</text>
<rect x="340" y="160" width="220" height="40" rx="6" class="yel"/>
<text x="450" y="177" text-anchor="middle" class="m">/tmp/cloonix_mount_nemo</text>
<text x="450" y="192" text-anchor="middle" class="s">host directory, /shared in both</text>
<path class="arg" d="M262,136 L345,170"/>
<path class="arg" d="M638,136 L555,170"/>
<text x="120" y="182" text-anchor="middle" class="s">conf/ is /etc/demo in cnt1</text>
</svg>
