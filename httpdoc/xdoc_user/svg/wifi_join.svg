<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f3460"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e94560"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8695"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker>
</defs>
<style>
text{fill:#1a1a2e;font-size:12px}
.m{font-family:monospace;font-size:11.5px;fill:#0f3460}
.w{fill:#ffffff;font-size:11px;font-weight:bold}
.s{font-size:10px;fill:#5a6472}
.box{fill:#f7f8fa;stroke:#0f3460;stroke-width:1.5}
.acc{fill:#fdeef1;stroke:#e94560;stroke-width:1.5}
.gry{fill:#f2f3f5;stroke:#7a8695;stroke-width:1.5}
.grn{fill:#eef8f1;stroke:#27ae60;stroke-width:1.5}
.yel{fill:#fdf6e3;stroke:#c8a24a;stroke-width:1.5}
.zone{fill:#eef4ff;stroke:#5a7fbf;stroke-width:1.5;stroke-dasharray:7 4}
.zoner{fill:#fff5f7;stroke:#e94560;stroke-width:1.5;stroke-dasharray:7 4}
.zoneg{fill:#f6f7f8;stroke:#7a8695;stroke-width:1.5;stroke-dasharray:7 4}
.cab{stroke:#3498db;stroke-width:2.5;fill:none}
.fib{stroke:#c8a24a;stroke-width:2.5;fill:none}
.arr{stroke:#0f3460;stroke-width:2;fill:none;marker-end:url(#a)}
.arrr{stroke:#e94560;stroke-width:2;fill:none;marker-end:url(#ar)}
.arg{stroke:#7a8695;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#ag)}
.lin{stroke:#0f3460;stroke-width:1.5;fill:none}
.ink{fill:#0f3460}
.pink{fill:#e94560}
.t{font-size:13px;font-weight:bold;fill:#0f3460}
.big{font-size:15px;font-weight:bold;fill:#0f3460}
.cabd{stroke:#3498db;stroke-width:2.5;fill:none;stroke-dasharray:6 4}
.air{fill:#fff8ec;stroke:#e08a1e;stroke-width:1.5;stroke-dasharray:3 3}
.arro{stroke:#e08a1e;stroke-width:2;fill:none;marker-end:url(#ao)}
.org{fill:#e08a1e}
</style>
<rect width="900" height="760" fill="#ffffff"/>
<rect class="grn" x="160" y="20" width="140" height="40" rx="6"/>
<text x="230" y="44" text-anchor="middle" class="t">station</text>
<rect class="acc" x="580" y="20" width="140" height="40" rx="6"/>
<text x="650" y="44" text-anchor="middle" class="t">access point</text>
<line class="lin" x1="230" y1="60" x2="230" y2="740"/>
<line class="lin" x1="650" y1="60" x2="650" y2="740"/>
<line class="arrr" x1="650" y1="90" x2="230" y2="90"/>
<text x="440" y="84" text-anchor="middle" class="m">Beacon  (every 102.4 ms, to all)</text>
<line class="arr" x1="230" y1="130" x2="650" y2="130"/>
<text x="440" y="124" text-anchor="middle" class="m">Probe Request  (who is there?)</text>
<line class="arrr" x1="650" y1="170" x2="230" y2="170"/>
<text x="440" y="164" text-anchor="middle" class="m">Probe Response  (SSID, rates, RSN)</text>
<line class="arr" x1="230" y1="210" x2="650" y2="210"/>
<text x="440" y="204" text-anchor="middle" class="m">Authentication  seq 1</text>
<line class="arrr" x1="650" y1="250" x2="230" y2="250"/>
<text x="440" y="244" text-anchor="middle" class="m">Authentication  seq 2, success</text>
<line class="arr" x1="230" y1="290" x2="650" y2="290"/>
<text x="440" y="284" text-anchor="middle" class="m">Association Request</text>
<line class="arrr" x1="650" y1="330" x2="230" y2="330"/>
<text x="440" y="324" text-anchor="middle" class="m">Association Response  AID</text>
<line class="arrr" x1="650" y1="370" x2="230" y2="370"/>
<text x="440" y="364" text-anchor="middle" class="m">EAPOL 1 of 4  ANonce</text>
<line class="arr" x1="230" y1="410" x2="650" y2="410"/>
<text x="440" y="404" text-anchor="middle" class="m">EAPOL 2 of 4  SNonce, MIC</text>
<line class="arrr" x1="650" y1="450" x2="230" y2="450"/>
<text x="440" y="444" text-anchor="middle" class="m">EAPOL 3 of 4  GTK, MIC</text>
<line class="arr" x1="230" y1="490" x2="650" y2="490"/>
<text x="440" y="484" text-anchor="middle" class="m">EAPOL 4 of 4  MIC</text>
<line class="arr" x1="230" y1="530" x2="650" y2="530"/>
<text x="440" y="524" text-anchor="middle" class="m">DHCP Discover</text>
<line class="arr" x1="650" y1="570" x2="230" y2="570"/>
<text x="440" y="564" text-anchor="middle" class="m">DHCP Offer</text>
<line class="arr" x1="230" y1="610" x2="650" y2="610"/>
<text x="440" y="604" text-anchor="middle" class="m">DHCP Request</text>
<line class="arr" x1="650" y1="650" x2="230" y2="650"/>
<text x="440" y="644" text-anchor="middle" class="m">DHCP Ack  address</text>
<line class="arr" x1="230" y1="690" x2="650" y2="690"/>
<text x="440" y="684" text-anchor="middle" class="m">ARP, then ICMP echo</text>
<rect class="gry" x="20" y="72" width="120" height="262" rx="6"/>
<text x="80" y="190" text-anchor="middle" class="t">management</text>
<text x="80" y="208" text-anchor="middle" class="s">in clear</text>
<text x="80" y="224" text-anchor="middle" class="s">no ip yet</text>
<rect class="yel" x="20" y="354" width="120" height="142" rx="6"/>
<text x="80" y="420" text-anchor="middle" class="t">keys</text>
<text x="80" y="438" text-anchor="middle" class="s">802.1X / EAPOL</text>
<text x="80" y="454" text-anchor="middle" class="s">WPA2, WPA3</text>
<rect class="grn" x="20" y="516" width="120" height="222" rx="6"/>
<text x="80" y="620" text-anchor="middle" class="t">data</text>
<text x="80" y="638" text-anchor="middle" class="s">encrypted</text>
<text x="80" y="654" text-anchor="middle" class="s">the ip stack</text>
<rect class="air" x="760" y="72" width="120" height="262" rx="6"/>
<text x="820" y="190" text-anchor="middle" class="s">open wifi</text>
<text x="820" y="206" text-anchor="middle" class="s">goes to data</text>
<text x="820" y="222" text-anchor="middle" class="s">from here</text>
</svg>
