!
! cisco1 of the demo. Gi1 Gi2 Gi3 are cloonix eth0 eth1 eth2, in order:
! there is no management interface in front of them any more, so this
! starts at Gi1 where the old one started at Gi2.
!
! speed/no negotiation: virtio-net does not negotiate.
!
hostname cisco1
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
exit
!
interface GigabitEthernet1
 ip address 1.0.0.2 255.255.255.0
 speed 1000
 no negotiation auto
 no shutdown
exit
!
interface GigabitEthernet2
 ip address 2.0.0.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 1
 speed 1000
 no negotiation auto
 no shutdown
exit
!
interface GigabitEthernet3
 ip address 3.0.0.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf cost 1
 speed 1000
 no negotiation auto
 no shutdown
exit
!
router ospf 1
 router-id 1.1.1.1
 redistribute connected subnets
 network 1.1.1.1 0.0.0.0 area 0
 network 2.0.0.0 0.0.0.255 area 0
 network 3.0.0.0 0.0.0.255 area 0
exit
!
